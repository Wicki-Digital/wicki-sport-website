name: Hosting-Verbindung testen

on:
  workflow_dispatch:

permissions: {}

jobs:
  verbindungstest:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verschlüsselten FTP-Zugriff prüfen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import ssl
          from ftplib import FTP_TLS

          with FTP_TLS(context=ssl.create_default_context(), timeout=30) as ftp:
              ftp.connect(os.environ["FTP_SERVER"], 21)
              ftp.login(
                  os.environ["FTP_USERNAME"],
                  os.environ["FTP_PASSWORD"]
              )
              ftp.prot_p()
              ftp.cwd("/")
              ftp.retrbinary("RETR index.html", lambda data: None)
              print("Erfolgreich: Verschlüsselte Verbindung und Lesezugriff funktionieren.")
          PY
